# Python helpers of PB3D: the HDF5 checks of the regression tests, the
# reference derivations and the Snellius and TERPSICHORE scripts, and the
# Fortran language server and linter. Not a package. `uv sync` makes .venv with all of it (Documentation/testing.md).
[project]
name = "pb3d-tools"
version = "0"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.16",                                   # tests/regression/check_*.py; CI pins 3.16.0
    "numpy",
]

[dependency-groups]
# reference derivations, figures, the cbm18a cut and the TERPSICHORE converter
scripts = ["matplotlib", "netCDF4", "scipy", "sympy"]
# editor and lint tools: the Fortran language server of the Modern Fortran
# extension, and the linter of the CI job, at the CI version
dev = ["fortls", "fortitude-lint==0.9.2"]
# tests/reference/vmec_twin.py only; large, so not installed by default
vmec = ["vmecpp"]

[tool.uv]
package = false
default-groups = ["dev", "scripts"]
