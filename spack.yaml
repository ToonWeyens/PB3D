# Spack environment for the libraries of PB3D that Spack packages: PETSc and
# SLEPc with complex scalars, parallel HDF5, NetCDF-Fortran, ScaLAPACK and
# pkg-config. PSPLINE, the minimal LIBSTELL and, optionally, STRUMPACK-Dense
# 1.1.1 are built outside Spack (Documentation/spack-setup.md).
#
#   spack env create pb3d spack.yaml
#   spack env activate pb3d
#   spack concretize
#   spack install
#
# Versions. PB3D builds and passes its tests with PETSc and SLEPc 3.19 (CI,
# Ubuntu 24.04) and 3.25 (macOS with gcc 16, Snellius with gcc 14);
# Modules/SLEPC_ops.f90 has the version guards in between. Spack takes the
# newest release in the range that it knows.
#
# +mumps. PB3D's eigensolve is shift-and-invert: SLEPc factorises the shifted
# matrix with LU. PETSc's own LU works on one process only, so without a
# distributed LU every PB3D run on two or more MPI processes stops in
# EPSSolve ("Could not locate a solver type for factorization type LU and
# matrix type mpibaij", PB3D error 92). MUMPS is that distributed LU; PETSc
# picks it by itself. CMake warns when the PETSc it finds has none.
#
# -DAVOID_MPI_IN_PLACE for MUMPS. Spack builds MUMPS as shared libraries.
# On macOS each of them keeps its own copy of the COMMON block behind
# MPI_IN_PLACE in mpif.h, so Open MPI does not recognise the MPI_IN_PLACE
# that MUMPS passes, and the reduction that maps the distributed right-hand
# side to the processes adds up garbage: PB3D crashed on two processes with
# a bus error in zmumps_scatter_dist_rhs (MUMPS 5.8.2 and 5.9.0). With the
# flag MUMPS uses a separate receive buffer instead. On Linux the flag only
# costs a copy of one integer array per solve.
#
# MPI. OpenMPI is preferred, not required: on a cluster, register the site
# MPI first (spack external find openmpi, or mpich) and Spack uses it. On
# macOS, Homebrew's OpenMPI 5 needs HWLOC_SYNTHETIC set before mpirun
# starts (Documentation/spack-setup.md).
spack:
  specs:
    - petsc@3.19:3.25 +complex +mumps ~hypre ~superlu-dist ~metis ~hdf5 ~fftw
    - slepc ~arpack
    - hdf5 +fortran +hl +mpi
    - netcdf-fortran
    - netlib-scalapack
    - pkgconf
  packages:
    all:
      prefer: ["%gcc"]
    mpi:
      prefer: [openmpi]
    mumps:
      require: ["fflags=-DAVOID_MPI_IN_PLACE"]
  concretizer:
    unify: true
  view: true
